name: DSH Web

# Builds the browser build of DSH Web and runs its installed-app and web-platform
# end-to-end tests. Pushes to web-platform also publish the build to Cloudflare Workers
# once the publish job is enabled; see apps/web/platform/README.md.
on:
  push:
    branches: [web-platform]
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/client/**'
      - 'packages/experimental/webworker-runtime/**'
      - 'packages/bundle/web-app/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/dsh-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DSH_CLIENT_TITLE: DSH Web
  DSH_TELEMETRY_DISABLED: '1'
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  build:
    name: Build and test DSH Web
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The client imports the host packages' declarations (each `/remote`
      # entry), so the host libraries build first, as in the preview lane.
      - name: Build workspace libraries
        run: pnpm run build:artifacts
      - name: Build the site
        run: pnpm --config.verifyDepsBeforeRun=false --filter @deepseek-ai/dsh-web-frontend run build:site
      # Uploaded before the tests so a failing run still leaves the build to inspect;
      # publishing still requires the whole job to pass.
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-web-site
          path: apps/web/dist-site
          if-no-files-found: error
          retention-days: 7
      # Full Chrome, as on a person's machine: Playwright's headless shell does
      # not report notification permission the way the installed app needs.
      - name: End-to-end tests
        env:
          DSH_E2E_CHROME: /usr/bin/google-chrome
        run: pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/pwa.e2e.ts apps/web/tests/web-platform.e2e.ts apps/web/tests/cordis-community.e2e.ts apps/web/tests/cloud-compute.e2e.ts

  publish:
    name: Publish to Cloudflare Workers
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/web-platform' && vars.DSH_WEB_WORKERS_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: dsh-web-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: dsh-web-site
          path: apps/web/dist-site
      - name: Deploy to Cloudflare Workers
        env:
          CF_API_TOKEN: ${{ secrets.DSH_WEB_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.DSH_WEB_WORKERS_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy --config apps/web/platform/wrangler.jsonc
      - name: Confirm the live version
        run: |
          expected=$(grep -o "const VERSION = '[^']*'" apps/web/dist-site/sw.js)
          live=$(curl -fsS "https://dsh-web.mzhub.workers.dev/sw.js?ci=${GITHUB_SHA}" | grep -o "const VERSION = '[^']*'")
          test -n "$expected" && test "$live" = "$expected"
          echo "live: $expected"
